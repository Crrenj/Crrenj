<text x="1170" y="30" text-anchor="end" fill="#8fb3a2" letter-spacing="2" style="font-size:12px">DATASHEET · HENRI · U1</text>
<g class="l" style="animation-delay:0.30s"><text x="30" y="96" fill="#4f6e60" font-size="13">01</text><text x="64" y="96" fill="#d7e6dc" xml:space="preserve">Je viens de Paris, en France, et je suis co-fondateur de <tspan fill="#ffd166" font-weight="700">Lanjo</tspan> <tspan fill="#ffd166" font-weight="700">Technologies</tspan>, une</text></g>
<g class="l" style="animation-delay:0.52s"><text x="30" y="130" fill="#4f6e60" font-size="13">02</text><text x="64" y="130" fill="#d7e6dc" xml:space="preserve">entreprise basée à Santiago, en République dominicaine, avec laquelle je travaille à</text></g>
<g class="l" style="animation-delay:0.74s"><text x="30" y="164" fill="#4f6e60" font-size="13">03</text><text x="64" y="164" fill="#d7e6dc" xml:space="preserve">distance. Je construis des produits de bout en bout : base de données, backend, web,</text></g>
<g class="l" style="animation-delay:0.96s"><text x="30" y="198" fill="#4f6e60" font-size="13">04</text><text x="64" y="198" fill="#d7e6dc" xml:space="preserve">mobile et paiements. En ce moment, presque tout mon temps va à <tspan fill="#ffd166" font-weight="700">Mi</tspan> <tspan fill="#ffd166" font-weight="700">SaludRD</tspan>, une</text></g>
<g class="l" style="animation-delay:1.18s"><text x="30" y="232" fill="#4f6e60" font-size="13">05</text><text x="64" y="232" fill="#d7e6dc" xml:space="preserve">plateforme qui relie patients et médecins dominicains.</text></g>
