<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-label="Je viens de Paris, en France, et je suis co-fondateur de Lanjo Technologies, une entreprise basée à Santiago, en République dominicaine, avec laquelle je travaille à distance. Je construis des produits de bout en bout : base de données, backend, web, mobile et paiements. En ce moment, presque tout mon temps va à Mi SaludRD, une plateforme qui relie patients et médecins dominicains.">
