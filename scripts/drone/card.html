<!doctype html>
<meta charset="utf-8">
<!-- Portaerius project card, rendered frame by frame by render.cjs (three.js is injected as window.THREE).
     The drone is a generic quadcopter placeholder: it does not depict the real airframe. -->
<style>
  html,body{margin:0;background:transparent}
  #card{position:relative;width:880px;height:460px;border-radius:36px;overflow:hidden;box-sizing:border-box;
    border:4px solid #b87333;background:linear-gradient(135deg,#0e3a29 0%,#0a2a1d 50%,#06170f 100%);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d7e6dc}
  #card:before{content:"";position:absolute;inset:0;background:
    repeating-linear-gradient(0deg,rgba(93,242,192,.045) 0 1px,transparent 1px 40px),
    repeating-linear-gradient(90deg,rgba(93,242,192,.045) 0 1px,transparent 1px 40px)}
  canvas{position:absolute;right:-34px;top:0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26%);mask-image:linear-gradient(90deg,transparent 0,#000 26%)}
  .pad{position:absolute;width:24px;height:24px;border-radius:50%;background:#e3b341}
  .pad:after{content:"";position:absolute;left:8px;top:8px;width:8px;height:8px;border-radius:50%;background:#06170f}
  h1{position:absolute;left:56px;top:64px;margin:0;font-size:54px;letter-spacing:5px;color:#ffd166;font-weight:800}
  .ref{position:absolute;right:76px;top:28px;font-size:19px;letter-spacing:3px;color:#8fb3a2}
  .led{position:absolute;right:38px;top:28px;width:18px;height:18px;border-radius:50%;background:#5df2c0;box-shadow:0 0 18px #5df2c0}
  p{position:absolute;left:56px;margin:0;font:29px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#cfe8da}
  .tags{position:absolute;left:56px;top:376px;display:flex;gap:14px;font-size:23px}
  .tags span{padding:9px 22px;border-radius:24px;background:rgba(93,242,192,.14);color:#bfe9d6}
  .tags .k{background:rgba(255,176,0,.16);color:#ffd166}
  .hud{position:absolute;right:44px;bottom:30px;font-size:19px;letter-spacing:2px;color:#ffb000;text-align:right}
  .hud b{color:#3dff8a}
</style>
<div id="card">
  <canvas id="c" width="500" height="460"></canvas>
  <div class="ref">U4 · MODULE</div><div class="led" id="led"></div>
  <h1>PORTAERIUS</h1>
  <p style="top:176px">Autonomous drone platform.</p>
  <p style="top:216px">Private R&amp;D, in development.</p>
  <div class="tags"><span>Python</span><span>C++</span><span class="k">private repo</span></div>
  <div class="hud"><b id="dot">●</b> TELEMETRY LINK<br>ALT HOLD · HOVER</div>
</div>
<script>
  for (const x of [-12, 868 - 4]) for (let y = 92; y < 380; y += 48) {
    const d = document.createElement('div'); d.className = 'pad'; d.style.left = x + 'px'; d.style.top = (y - 12) + 'px'; document.getElementById('card').appendChild(d);
  }
  window.setup = function () {
    const T = THREE, canvas = document.getElementById('c');
    const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(500, 460, false);
    const scene = new T.Scene();
    const cam = new T.PerspectiveCamera(32, 500 / 460, 0.1, 50); cam.position.set(0, 2.9, 8.2); cam.lookAt(0, -0.1, 0);
    scene.add(new T.HemisphereLight(0xcfe8da, 0x06170f, 1.1));
    const key = new T.DirectionalLight(0xffc56b, 2.6); key.position.set(3, 5, 4); scene.add(key);
    const rim = new T.DirectionalLight(0x5df2c0, 2.2); rim.position.set(-4, 2, -3); scene.add(rim);

    const dark = new T.MeshStandardMaterial({ color: 0x18221e, metalness: 0.65, roughness: 0.38 });
    const copper = new T.MeshStandardMaterial({ color: 0xb87333, metalness: 0.9, roughness: 0.3 });
    const edge = new T.LineBasicMaterial({ color: 0x5df2c0, transparent: true, opacity: 0.75 });
    const amber = new T.MeshBasicMaterial({ color: 0xffb000 });
    const withEdges = (mesh, thr = 20) => { mesh.add(new T.LineSegments(new T.EdgesGeometry(mesh.geometry, thr), edge)); return mesh; };

    const tilt = new T.Group(), drone = new T.Group(); tilt.add(drone); scene.add(tilt);
    drone.add(withEdges(new T.Mesh(new T.CylinderGeometry(0.52, 0.6, 0.24, 8), dark)));
    const top = withEdges(new T.Mesh(new T.CylinderGeometry(0.3, 0.46, 0.14, 8), dark)); top.position.y = 0.19; drone.add(top);
    const gimbal = new T.Mesh(new T.SphereGeometry(0.17, 20, 14), dark); gimbal.position.y = -0.22; drone.add(gimbal);
    const lens = new T.Mesh(new T.SphereGeometry(0.075, 16, 12), new T.MeshBasicMaterial({ color: 0x5df2c0 })); lens.position.y = -0.33; drone.add(lens);
    const props = [];
    for (let k = 0; k < 4; k++) {
      const a = Math.PI / 4 + k * Math.PI / 2, arm = new T.Group(); arm.rotation.y = a; drone.add(arm);
      const beam = withEdges(new T.Mesh(new T.BoxGeometry(1.25, 0.07, 0.11), dark)); beam.position.x = 0.98; arm.add(beam);
      const motor = withEdges(new T.Mesh(new T.CylinderGeometry(0.13, 0.13, 0.2, 14), copper), 40); motor.position.set(1.6, 0.07, 0); arm.add(motor);
      const leg = new T.Mesh(new T.CylinderGeometry(0.02, 0.02, 0.5, 6), dark); leg.position.set(1.0, -0.26, 0); leg.rotation.z = 0.25; arm.add(leg);
      const led = new T.Mesh(new T.SphereGeometry(0.05, 10, 8), amber); led.position.set(1.6, -0.07, 0); arm.add(led);
      const disc = new T.Mesh(new T.CircleGeometry(0.72, 40), new T.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.1, side: T.DoubleSide, depthWrite: false }));
      disc.rotation.x = -Math.PI / 2; disc.position.set(1.6, 0.2, 0); arm.add(disc);
      const ring = new T.LineLoop(new T.BufferGeometry().setFromPoints(Array.from({ length: 48 }, (_, i) => new T.Vector3(Math.cos(i / 48 * 6.2832) * 0.72, 0, Math.sin(i / 48 * 6.2832) * 0.72))), new T.LineBasicMaterial({ color: 0xffb000, transparent: true, opacity: 0.55 }));
      ring.position.set(1.6, 0.2, 0); arm.add(ring);
      const blade = new T.Mesh(new T.BoxGeometry(1.4, 0.012, 0.09), new T.MeshBasicMaterial({ color: 0xeafff4, transparent: true, opacity: 0.5 }));
      blade.position.set(1.6, 0.2, 0); arm.add(blade); props.push([blade, k % 2 ? -1 : 1]);
    }
    const grid = new T.GridHelper(14, 28, 0xb87333, 0x2c6a50); grid.position.y = -1.25; grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);
    const pings = [0, 0.5].map((ph) => {
      const m = new T.Mesh(new T.RingGeometry(0.96, 1.0, 64), new T.MeshBasicMaterial({ color: 0x5df2c0, transparent: true, side: T.DoubleSide }));
      m.rotation.x = -Math.PI / 2; m.position.y = -1.24; scene.add(m); return [m, ph];
    });
    // t in [0,1): one seamless loop (the airframe is 4-fold symmetric, so a quarter turn loops).
    window.frame = function (t) {
      drone.rotation.y = t * Math.PI / 2;
      tilt.position.y = 0.1 + 0.09 * Math.sin(t * 2 * Math.PI);
      tilt.rotation.z = 0.06 * Math.sin(t * 2 * Math.PI); tilt.rotation.x = 0.05 * Math.cos(t * 2 * Math.PI);
      props.forEach(([b, dir], i) => (b.rotation.y = dir * t * Math.PI * 8 + i));
      pings.forEach(([m, ph]) => { const u = (t + ph) % 1; m.scale.setScalar(0.4 + u * 2.4); m.material.opacity = 0.7 * (1 - u); });
      document.getElementById('led').style.opacity = 0.35 + 0.65 * (0.5 + 0.5 * Math.cos(t * 2 * Math.PI));
      document.getElementById('dot').style.opacity = t < 0.5 ? 1 : 0.2;
      renderer.render(scene, cam);
    };
    return renderer.getContext().getParameter(renderer.getContext().VERSION);
  };
</script>
