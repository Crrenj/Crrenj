<!doctype html>
<meta charset="utf-8">
<!-- Portaerius project card, rendered frame by frame by render.cjs.
     render.cjs injects three.js (window.THREE) and scripts/drone/card-template.svg (built by
     scripts/build-cards.mjs) into #svg; the 3D drone shows through the template's see-through plate.
     The drone is a generic quadcopter placeholder: it does not depict the real airframe. -->
<style>
  html,body{margin:0;background:transparent}
  #card{position:relative;width:1320px;height:330px}
  /* plate = (24,24,440,252) in the 1200x300 template, x1.1 */
  canvas{position:absolute;left:26px;top:26px;width:485px;height:278px;border-radius:15px;background:
    repeating-linear-gradient(0deg,rgba(93,242,192,.05) 0 1px,transparent 1px 33px),
    repeating-linear-gradient(90deg,rgba(93,242,192,.05) 0 1px,transparent 1px 33px),#061009}
  #svg{position:absolute;inset:0}#svg svg{display:block;width:1320px;height:330px}
</style>
<div id="card"><canvas id="c" width="970" height="556"></canvas><div id="svg"></div></div>
<script>
  window.setup = function () {
    const T = THREE, canvas = document.getElementById('c');
    const svg = document.querySelector('#svg svg'); svg.pauseAnimations();
    const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(970, 556, false);
    const scene = new T.Scene();
    const cam = new T.PerspectiveCamera(30, 970 / 556, 0.1, 50); cam.position.set(0, 2.3, 5.9); cam.lookAt(0, -0.2, 0);
    scene.add(new T.HemisphereLight(0xeafff4, 0x1c4a38, 2.6));
    const key = new T.DirectionalLight(0xffd9a0, 4.5); key.position.set(3, 5, 4); scene.add(key);
    const rim = new T.DirectionalLight(0x5df2c0, 4); rim.position.set(-4, 2, -3); scene.add(rim);

    const dark = new T.MeshStandardMaterial({ color: 0x5a7468, metalness: 0.35, roughness: 0.45 });
    const copper = new T.MeshStandardMaterial({ color: 0xb87333, metalness: 0.9, roughness: 0.3 });
    const edge = new T.LineBasicMaterial({ color: 0x8dffd9, transparent: true, opacity: 1 });
    const amber = new T.MeshBasicMaterial({ color: 0xffb000 });
    const withEdges = (mesh, thr = 20) => { mesh.add(new T.LineSegments(new T.EdgesGeometry(mesh.geometry, thr), edge)); return mesh; };

    const tilt = new T.Group(), drone = new T.Group(); tilt.add(drone); scene.add(tilt);
    drone.add(withEdges(new T.Mesh(new T.CylinderGeometry(0.52, 0.6, 0.24, 8), dark)));
    const top = withEdges(new T.Mesh(new T.CylinderGeometry(0.3, 0.46, 0.14, 8), dark)); top.position.y = 0.19; drone.add(top);
    const gimbal = new T.Mesh(new T.SphereGeometry(0.17, 20, 14), dark); gimbal.position.y = -0.22; drone.add(gimbal);
    const lens = new T.Mesh(new T.SphereGeometry(0.075, 16, 12), new T.MeshBasicMaterial({ color: 0x5df2c0 })); lens.position.y = -0.33; drone.add(lens);
    const props = [];
    for (let k = 0; k < 4; k++) {
      const a = Math.PI / 4 + k * Math.PI / 2, arm = new T.Group(); arm.rotation.y = a; drone.add(arm);
      const beam = withEdges(new T.Mesh(new T.BoxGeometry(1.25, 0.07, 0.11), dark)); beam.position.x = 0.98; arm.add(beam);
      const motor = withEdges(new T.Mesh(new T.CylinderGeometry(0.13, 0.13, 0.2, 14), copper), 40); motor.position.set(1.6, 0.07, 0); arm.add(motor);
      const leg = new T.Mesh(new T.CylinderGeometry(0.02, 0.02, 0.5, 6), dark); leg.position.set(1.0, -0.26, 0); leg.rotation.z = 0.25; arm.add(leg);
      const led = new T.Mesh(new T.SphereGeometry(0.05, 10, 8), amber); led.position.set(1.6, -0.07, 0); arm.add(led);
      const disc = new T.Mesh(new T.CircleGeometry(0.72, 40), new T.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.2, side: T.DoubleSide, depthWrite: false }));
      disc.rotation.x = -Math.PI / 2; disc.position.set(1.6, 0.2, 0); arm.add(disc);
      const ring = new T.LineLoop(new T.BufferGeometry().setFromPoints(Array.from({ length: 48 }, (_, i) => new T.Vector3(Math.cos(i / 48 * 6.2832) * 0.72, 0, Math.sin(i / 48 * 6.2832) * 0.72))), new T.LineBasicMaterial({ color: 0xffb000, transparent: true, opacity: 0.55 }));
      ring.position.set(1.6, 0.2, 0); arm.add(ring);
      const blade = new T.Mesh(new T.BoxGeometry(1.4, 0.012, 0.09), new T.MeshBasicMaterial({ color: 0xeafff4, transparent: true, opacity: 0.8 }));
      blade.position.set(1.6, 0.2, 0); arm.add(blade); props.push([blade, k % 2 ? -1 : 1]);
    }
    const grid = new T.GridHelper(28, 56, 0xb87333, 0x2c6a50); grid.position.y = -1.25; grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);
    const pings = [0, 0.5].map((ph) => {
      const m = new T.Mesh(new T.RingGeometry(0.96, 1.0, 64), new T.MeshBasicMaterial({ color: 0x5df2c0, transparent: true, side: T.DoubleSide }));
      m.rotation.x = -Math.PI / 2; m.position.y = -1.24; scene.add(m); return [m, ph];
    });
    // t in [0,1): one seamless loop (the airframe is 4-fold symmetric, so a quarter turn loops).
    window.frame = function (t) {
      drone.rotation.y = t * Math.PI / 2;
      tilt.position.y = 0.1 + 0.09 * Math.sin(t * 2 * Math.PI);
      tilt.rotation.z = 0.06 * Math.sin(t * 2 * Math.PI); tilt.rotation.x = 0.05 * Math.cos(t * 2 * Math.PI);
      props.forEach(([b, dir], i) => (b.rotation.y = dir * t * Math.PI * 8 + i));
      pings.forEach(([m, ph]) => { const u = (t + ph) % 1; m.scale.setScalar(0.4 + u * 2.4); m.material.opacity = 0.7 * (1 - u); });
      svg.setCurrentTime(t * 2.4); // the template's SMIL animations all loop in 2.4 s
      renderer.render(scene, cam);
    };
    return renderer.getContext().getParameter(renderer.getContext().VERSION);
  };
</script>
